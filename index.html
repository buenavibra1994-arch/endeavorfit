<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENIS CALI - Drops Exclusivos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black, sans-serif}
body{background:#fff;color:#000}
.header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:100;border-bottom:1px solid #eee}
.logo{font-size:28px;font-style:italic}.logo span{background:#000;color:#fff;padding:2px 6px}
.cart{font-size:24px;position:relative;cursor:pointer}
.cart span{position:absolute;top:-8px;right:-10px;background:red;color:#fff;font-size:11px;padding:2px 6px;border-radius:20px;font-family:Arial}
.hero{background:#000;color:#fff;padding:60px 20px;text-align:center}
.hero h1{font-size:54px;line-height:.9;font-style:italic}.hero h1 i{color:#FFD700}
.filters{display:flex;gap:10px;overflow-x:auto;padding:15px 20px;border-bottom:1px solid #eee}
.filter{border:1px solid #000;padding:8px 18px;border-radius:20px;white-space:nowrap;cursor:pointer;font-family:Arial;font-weight:bold;font-size:14px}
.filter.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;max-width:1200px;margin:auto}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid #eee;border-radius:12px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;background:#f6f6f6}
.info{padding:12px}
.info h3{font-size:14px;font-family:Arial;font-weight:900;height:32px;overflow:hidden}
.price{font-size:18px;margin:6px 0}
.tallas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.talla{border:1px solid #ddd;padding:4px 8px;font-size:11px;border-radius:4px;cursor:pointer;font-family:Arial}
.talla.active{background:#000;color:#fff}
.btn{width:100%;background:#000;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.btn:hover{background:#FFD700;color:#000}
#drawer{position:fixed;top:0;right:-100%;width:92%;max-width:380px;height:100%;background:#fff;z-index:200;box-shadow:-10px 0 30px rgba(0,0,0,.2);transition:.3s;padding:20px;overflow:auto}
#drawer.open{right:0}
</style>
</head>
<body>

<div class="header">
<div class="logo">TENIS <span>CALI</span></div>
<div class="cart" onclick="toggleCart()">🛒 <span id="count">0</span></div>
</div>

<div class="hero">
<h1>NUEVOS <br><i>DROPS</i></h1>
<p style="font-family:Arial;margin-top:10px">Envío gratis en Cali - Pago contra entrega</p>
</div>

<div class="filters">
<div class="filter active" onclick="filtrar('todos',this)">TODOS</div>
<div class="filter" onclick="filtrar('jordan',this)">JORDAN</div>
<div class="filter" onclick="filtrar('nike',this)">NIKE</div>
<div class="filter" onclick="filtrar('adidas',this)">ADIDAS</div>
<div class="filter" onclick="filtrar('newbalance',this)">NEW BALANCE</div>
</div>

<div class="grid" id="grid"></div>

<div id="drawer">
<div style="display:flex;justify-content:space-between"><h2>CARRITO</h2><span onclick="toggleCart()" style="cursor:pointer;font-size:24px">✕</span></div>
<div id="cartItems" style="margin-top:20px"></div>
<div style="margin-top:20px;border-top:1px solid #eee;padding-top:15px">
<p style="font-family:Arial">Total: <b id="total">$0</b></p>
<button class="btn" onclick="pedirWA()">PEDIR POR WHATSAPP</button>
<p style="font-family:Arial;font-size:12px;color:#888;margin-top:8px">Se enviará tu pedido con tallas al 3017881229</p>
</div>
</div>

<script>
// ========== EDITA TUS TENIS AQUI - COMO WORDPRESS ==========
const TENIS = [
  {id:1, nombre:"Jordan 1 Retro High OG", precio:320000, marca:"jordan", foto:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600", tallas:["38","39","40","41","42"]},
  {id:2, nombre:"Nike Air Max 90", precio:280000, marca:"nike", foto:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600", tallas:["37","38","40","41"]},
  {id:3, nombre:"Adidas Samba OG", precio:295000, marca:"adidas", foto:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=600", tallas:["38","39","40","42","43"]},
  {id:4, nombre:"New Balance 550", precio:310000, marca:"newbalance", foto:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600", tallas:["38","40","41","42"]},
];
// Tu WhatsApp
const WA = "573017881229";
// =========================================================

let carrito = [];
let tallaSeleccionada = {};

function pintar(lista){
  const g = document.getElementById('grid'); g.innerHTML='';
  lista.forEach(t=>{
    g.innerHTML+=`
    <div class="card">
      <img src="${t.foto}">
      <div class="info">
        <h3>${t.nombre}</h3>
        <div class="price">$${t.precio.toLocaleString('es-CO')}</div>
        <div class="tallas">${t.tallas.map(tt=>`<div class="talla" onclick="selTalla(${t.id},'${tt}',this)">${tt}</div>`).join('')}</div>
        <button class="btn" onclick="addCart(${t.id})">AGREGAR</button>
      </div>
    </div>`
  })
}
function selTalla(id,talla,el){
  tallaSeleccionada[id]=talla;
  el.parentElement.querySelectorAll('.talla').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
}
function addCart(id){
  if(!tallaSeleccionada[id]) return alert('Elige una talla primero');
  const prod = TENIS.find(t=>t.id===id);
  carrito.push({...prod, talla:tallaSeleccionada[id]});
  document.getElementById('count').innerText=carrito.length;
  renderCart();
  toggleCart(true);
}
function renderCart(){
  const c=document.getElementById('cartItems'); c.innerHTML='';
  let total=0;
  carrito.forEach((p,i)=>{
    total+=p.precio;
    c.innerHTML+=`<div style="display:flex;gap:10px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:10px;font-family:Arial;font-size:13px"><img src="${p.foto}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><div><b>${p.nombre}</b><br>Talla: ${p.talla}<br>$${p.precio.toLocaleString()}<br><span onclick="carrito.splice(${i},1);renderCart();document.getElementById('count').innerText=carrito.length" style="color:red;cursor:pointer">Quitar</span></div></div>`
  });
  document.getElementById('total').innerText='$'+total.toLocaleString('es-CO');
}
function toggleCart(open){
  const d=document.getElementById('drawer');
  if(open) d.classList.add('open'); else d.classList.toggle('open');
}
function filtrar(marca,el){
  document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active'));
  el.classList.add('active');
  if(marca==='todos') pintar(TENIS); else pintar(TENIS.filter(t=>t.marca===marca));
}
function pedirWA(){
  if(carrito.length===0) return alert('Carrito vacío');
  let msg="Hola! Quiero pedir:%0A";
  carrito.forEach(p=>{msg+=`%0A- ${p.nombre} Talla ${p.talla} $${p.precio}`});
  msg+=`%0ATotal: ${document.getElementById('total').innerText}`;
  window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');
}
pintar(TENIS);
</script>
</body>
</html>
